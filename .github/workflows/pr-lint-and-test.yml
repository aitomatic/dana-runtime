# Lint + test on pull requests to protected branches
# Skips live and deep tests — those require API keys and run locally

name: PR Lint & Test

on:
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    # The session-journal contract tests REQUIRE a real Postgres in CI
    # (CI=true makes the [postgres] parametrizations fail, not skip,
    # when DANA_TEST_POSTGRES_DSN is unset — see
    # tests/integration/test_session_journal_contract.py).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Pin uv to the matrix python — otherwise uv resolves its own
          # interpreter and the "(3.12)" job name lies about what ran.
          python-version: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check dana/

      - name: Run tests (no live, no deep)
        env:
          DANA_MOCK_LLM: "true"
          DANA_USE_REAL_LLM: "false"
          DANA_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run pytest tests/ -m "not live and not deep" -v --maxfail=10 --tb=short --durations=10
