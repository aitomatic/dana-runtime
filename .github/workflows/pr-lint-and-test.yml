# Lint + test on pull requests to protected branches
# Skips live and deep tests: those require API keys and run locally.
#
# Two lanes:
#   * PRs to develop + manual dispatch: fast feedback without PostgreSQL.
#   * Every PR and manual dispatch: real postgres:16 service, including
#     session-journal and checkpoint contracts against both backends.

name: PR Lint & Test

on:
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

jobs:
  lint-and-test:
    # Fast lane: everything except PRs into master
    if: github.event_name != 'pull_request' || github.base_ref != 'master'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Pin uv to the matrix python — otherwise uv resolves its own
          # interpreter and the "(3.12)" job name lies about what ran.
          python-version: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check dana/

      - name: Run tests (no live, no deep, no postgres)
        env:
          DANA_MOCK_LLM: "true"
          DANA_USE_REAL_LLM: "false"
        # No postgres service on this lane — deselect the [postgres]
        # parametrizations so they skip-by-selection instead of failing
        # their CI=true-without-DSN contract check.
        run: uv run pytest tests/ -m "not live and not deep" -k "not postgres" -v --maxfail=10 --tb=short --durations=10

  lint-and-test-postgres:
    # Required storage coverage on develop as well as master and manual runs.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check dana/

      - name: Run tests (no live, no deep, with postgres contract)
        env:
          DANA_MOCK_LLM: "true"
          DANA_USE_REAL_LLM: "false"
          DANA_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run pytest tests/ -m "not live and not deep" -v --maxfail=10 --tb=short --durations=10

      - name: Smoke benchmark entry points (no paid requests)
        env:
          DANA_MOCK_LLM: "true"
          DANA_USE_REAL_LLM: "false"
          LANGFUSE_ENABLED: "false"
          LANGSMITH_TRACING: "false"
          DANA_LANGSMITH_ENABLED: "0"
        run: |
          uv run --no-sync python benchmarks/benchmark_startup.py --repetitions 1 --output /tmp/benchmark-startup.json
          uv run --no-sync python benchmarks/benchmark_session.py --mode isolated --cases fail_closed_guard,warm_no_tool_turns --repetitions 2 --output /tmp/benchmark-session.json
          uv run --no-sync python benchmarks/benchmark_history_delta.py --repetitions 1 --output /tmp/benchmark-history.json
          uv run --no-sync python benchmarks/benchmark_tools_history.py --lanes history --sizes 10 --repetitions 1 --output /tmp/benchmark-tools-history.json
          uv run --no-sync python benchmarks/benchmark_live.py --help
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          def result(name):
              return json.loads(Path(f"/tmp/benchmark-{name}.json").read_text())
          assert all(row["exit_code"] == 0 and row["help_present"] for row in result("startup")["rows"])
          session = result("session")
          assert all(case["status"] == "ok" for case in session["lanes"]["isolated"]["cases"].values())
          assert not session["known_failures"], session["known_failures"]
          assert session["lanes"]["isolated"]["cases"]["isolated/warm_no_tool_turns"]["observation"]["terminal_fact_types"] == ["TURN_COMPLETED"]
          assert all(case["new_turn_context_correct"] and case["reopen_context_equal"] for case in result("history")["cases"])
          assert not [failure for failure in result("tools-history")["known_failures"] if failure["severity"] == "defect"], result("tools-history")["known_failures"]
          assert result("tools-history")["checks_summary"]["fail"] == 0, result("tools-history")["checks_summary"]
          PY
