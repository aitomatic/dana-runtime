# Lint + test on pull requests to protected branches
# Skips live and deep tests — those require API keys and run locally

name: PR Lint & Test

on:
  pull_request:
    branches: [develop, stable, main, 'main/**']
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check dana/

      - name: Run tests (no live, no deep)
        env:
          DANA_MOCK_LLM: "true"
          DANA_USE_REAL_LLM: "false"
        run: uv run pytest tests/ -m "not live and not deep" -v --maxfail=10 --tb=short --durations=10
