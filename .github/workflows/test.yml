name: Tests

on:
  pull_request:
    branches:
      - develop
      - stable
      - main
      - 'main/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check dana/

      - name: Run tests (mocked LLM, no live calls)
        env:
          DANA_MOCK_LLM: "true"
          DANA_USE_REAL_LLM: "false"
        run: uv run pytest tests/ -v --maxfail=10 --tb=short
